<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bean</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b10; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; user-select: none;
    }
    .hud { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px; }
    .pill { background: #11151f; border: 1px solid rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 10px; font-size: 13px; }
    .pill strong { color: #22c55e; margin-left: 4px; }
    .wrap { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid rgba(34,197,94,0.35); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    canvas { display: block; cursor: pointer; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="pill">Score <strong id="score">0</strong></div>
    <div class="pill">Medal <strong id="medal">—</strong></div>
    <div class="pill">Best <strong id="best">0</strong></div>
  </div>
  <div class="wrap">
    <canvas id="c" width="400" height="540"></canvas>
  </div>
  <div class="hint">Press Space, ↑, or Click/Tap to Flap</div>

  <script>
    const STORAGE_KEY = 'bean_game_flappy_v1';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const medalEl = document.getElementById('medal');

    let best = 0;
    try { best = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}').best || 0; } catch {}
    bestEl.textContent = best;

    let state = 'ready'; // ready | play | dead
    let bird = { x: 96, y: 240, vy: 0, r: 15 };
    let pipes = [];
    let score = 0;
    let frame = 0;

    const GRAVITY = 0.44;
    const FLAP = -7.6;
    const GAP = 138;
    const PIPE_W = 58;
    const SPEED = 2.7;

    function saveBest() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ best })); } catch {}
    }

    function getMedal(s) {
      if (s >= 40) return '🏆 Platinum';
      if (s >= 25) return '🥇 Gold';
      if (s >= 12) return '🥈 Silver';
      if (s >= 5) return '🥉 Bronze';
      return '—';
    }

    function reset() {
      bird = { x: 96, y: 240, vy: 0, r: 15 };
      pipes = [];
      score = 0;
      frame = 0;
      state = 'play';
      scoreEl.textContent = '0';
      medalEl.textContent = '—';
      bird.vy = FLAP;
    }

    function flap() {
      if (state === 'ready' || state === 'dead') {
        reset();
      } else {
        bird.vy = FLAP;
      }
    }

    function die() {
      state = 'dead';
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        saveBest();
      }
      medalEl.textContent = getMedal(score);
    }

    function update() {
      if (state !== 'play') return;
      frame++;
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      if (bird.y - bird.r < 0 || bird.y + bird.r > canvas.height - 28) {
        return die();
      }

      if (frame % 95 === 0) {
        const topH = 60 + Math.random() * (canvas.height - GAP - 150);
        pipes.push({ x: canvas.width + 10, topH, passed: false });
      }

      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          medalEl.textContent = getMedal(score);
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            saveBest();
          }
        }
        const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
        if (inX && (bird.y - bird.r < p.topH || bird.y + bird.r > p.topH + GAP)) {
          return die();
        }
      }
      pipes = pipes.filter((p) => p.x + PIPE_W > -10);
    }

    function draw() {
      // Night sky gradient
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#0b1222');
      g.addColorStop(1, '#111d2e');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      for (const p of pipes) {
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, PIPE_W, p.topH);
        ctx.fillRect(p.x, p.topH + GAP, PIPE_W, canvas.height - (p.topH + GAP) - 28);
        ctx.fillStyle = '#34d399';
        ctx.fillRect(p.x - 4, p.topH - 18, PIPE_W + 8, 18);
        ctx.fillRect(p.x - 4, p.topH + GAP, PIPE_W + 8, 18);
      }

      // Ground strip
      ctx.fillStyle = '#171c2b';
      ctx.fillRect(0, canvas.height - 28, canvas.width, 28);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, canvas.height - 28, canvas.width, 3);

      // Bird (Emerald Bean)
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.5, Math.min(1.1, bird.vy * 0.08)));
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.r + 3, bird.r - 1, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#090b10';
      ctx.beginPath();
      ctx.arc(7.5, -4, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (state === 'ready' || state === 'dead') {
        ctx.fillStyle = 'rgba(9,11,16,0.68)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 30px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(state === 'ready' ? 'Flappy Bean' : 'Game Over', canvas.width / 2, 230);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '15px system-ui';
        ctx.fillText(
          state === 'ready' ? 'Press Space or Click to Start' : `Score: ${score}  ·  Best: ${best}`,
          canvas.width / 2,
          268
        );
        if (state === 'dead') {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '13px system-ui';
          ctx.fillText('Click or Press Space to Retry', canvas.width / 2, 302);
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('pointerdown', flap);
    loop();
  </script>
</body>
</html>
