<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bean Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b10; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; user-select: none;
    }
    .hud {
      width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
    }
    .stat { background: #11151f; border: 1px solid rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 10px; font-size: 13px; }
    .stat strong { color: #10b981; margin-left: 4px; }
    .controls { display: flex; gap: 6px; }
    button, select {
      background: #171c2b; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600;
    }
    button:hover { border-color: #10b981; }
    .stage { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid rgba(16,185,129,0.35); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    canvas { display: block; background: #0d121d; }
    .overlay {
      position: absolute; inset: 0; background: rgba(9,11,16,0.82); backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 24px; color: #10b981; }
    .overlay p { font-size: 13px; color: #94a3b8; }
    .primary { background: #10b981; color: #05110c; border: none; padding: 10px 22px; font-size: 14px; }
    .primary:hover { background: #059669; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="display:flex;gap:8px;">
      <div class="stat">Score <strong id="score">0</strong></div>
      <div class="stat">Best <strong id="best">0</strong></div>
    </div>
    <div class="controls">
      <select id="speed">
        <option value="130">Chill</option>
        <option value="95" selected>Classic</option>
        <option value="65">Turbo</option>
      </select>
      <button id="wrap-btn">Walls: Solid</button>
      <button id="pause-btn">Pause</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="board" width="440" height="440"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ov-title">Bean Snake</h2>
      <p id="ov-sub">Collect emerald beans to grow. Don't crash!</p>
      <button id="start-btn" class="primary">Play Now</button>
    </div>
  </div>
  <div class="hint">Controls: Arrow Keys / WASD · Space to Pause</div>

  <script>
    const STORAGE_KEY = 'bean_game_snake_v1';
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const GRID = 22;
    const CELL = canvas.width / GRID;

    let saved = { best: 0, wrap: false };
    try { saved = { ...saved, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }; } catch {}

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 12, y: 10 };
    let score = 0;
    let running = false;
    let paused = false;
    let loopTimer = null;

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const speedSel = document.getElementById('speed');
    const wrapBtn = document.getElementById('wrap-btn');
    const pauseBtn = document.getElementById('pause-btn');

    bestEl.textContent = saved.best;
    wrapBtn.textContent = saved.wrap ? 'Walls: Wrap' : 'Walls: Solid';

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch {}
    }

    function spawnFood() {
      let pt;
      do {
        pt = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      } while (snake.some((s) => s.x === pt.x && s.y === pt.y));
      food = pt;
    }

    function startGame() {
      snake = [{ x: 10, y: 11 }, { x: 9, y: 11 }, { x: 8, y: 11 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      paused = false;
      running = true;
      scoreEl.textContent = '0';
      pauseBtn.textContent = 'Pause';
      overlay.classList.add('hidden');
      spawnFood();
      restartLoop();
      draw();
    }

    function restartLoop() {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = setInterval(tick, Number(speedSel.value));
    }

    function gameOver() {
      running = false;
      clearInterval(loopTimer);
      if (score > saved.best) {
        saved.best = score;
        bestEl.textContent = saved.best;
        persist();
      }
      ovTitle.textContent = 'Game Over';
      ovSub.textContent = `Score: ${score} · Best: ${saved.best}`;
      document.getElementById('start-btn').textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function tick() {
      if (!running || paused) return;
      dir = nextDir;
      let nx = snake[0].x + dir.x;
      let ny = snake[0].y + dir.y;

      if (saved.wrap) {
        nx = (nx + GRID) % GRID;
        ny = (ny + GRID) % GRID;
      } else if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) {
        return gameOver();
      }

      if (snake.some((s) => s.x === nx && s.y === ny)) {
        return gameOver();
      }

      snake.unshift({ x: nx, y: ny });
      if (nx === food.x && ny === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > saved.best) {
          saved.best = score;
          bestEl.textContent = saved.best;
          persist();
        }
        spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#0d121d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }

      // Food bean
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, idx) => {
        const pad = idx === 0 ? 1 : 2;
        ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
      });
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
      if (k === ' ' && running) {
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        return;
      }
      if ((k === 'arrowup' || k === 'w') && dir.y !== 1) nextDir = { x: 0, y: -1 };
      else if ((k === 'arrowdown' || k === 's') && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if ((k === 'arrowleft' || k === 'a') && dir.x !== 1) nextDir = { x: -1, y: 0 };
      else if ((k === 'arrowright' || k === 'd') && dir.x !== -1) nextDir = { x: 1, y: 0 };
    });

    speedSel.addEventListener('change', () => { if (running) restartLoop(); });
    wrapBtn.addEventListener('click', () => {
      saved.wrap = !saved.wrap;
      wrapBtn.textContent = saved.wrap ? 'Walls: Wrap' : 'Walls: Solid';
      persist();
    });
    pauseBtn.addEventListener('click', () => {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    });
    document.getElementById('start-btn').addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
