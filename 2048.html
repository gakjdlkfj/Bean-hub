<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b10; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; user-select: none;
    }
    .top { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 28px; font-weight: 900; color: #f59e0b; }
    .scores { display: flex; gap: 8px; }
    .box { background: #11151f; border: 1px solid rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 10px; text-align: center; }
    .box span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .box strong { font-size: 16px; }
    .bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    button {
      background: #171c2b; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    button:hover { border-color: #f59e0b; }
    .grid {
      width: 100%; max-width: 400px; aspect-ratio: 1; background: #11151f;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; position: relative;
    }
    .cell {
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 26px; transition: transform 0.1s ease, background 0.12s ease;
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(9,11,16,0.85); border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .overlay.hidden { display: none; }
    .primary { background: #f59e0b; color: #111; border: none; padding: 10px 20px; font-size: 14px; }
    .hint { margin-top: 12px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="box"><span>Score</span><strong id="score">0</strong></div>
      <div class="box"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </div>
  <div class="bar">
    <button id="undo-btn">↩ Undo (Z)</button>
    <button id="new-btn">New Game</button>
  </div>
  <div class="grid" id="grid">
    <div id="overlay" class="overlay hidden">
      <h2 id="ov-msg" style="font-size:24px;color:#f59e0b;">Game Over</h2>
      <button id="retry-btn" class="primary">Play Again</button>
    </div>
  </div>
  <div class="hint">Controls: Arrow Keys / WASD · Z to Undo · Auto-Saves Progress</div>

  <script>
    const STORAGE_KEY = 'bean_game_2048_v1';
    const COLORS = {
      0: ['#181e2e', 'transparent'],
      2: ['#1e293b', '#e2e8f0'],
      4: ['#334155', '#f8fafc'],
      8: ['#b45309', '#fff'],
      16: ['#c2410c', '#fff'],
      32: ['#dc2626', '#fff'],
      64: ['#e11d48', '#fff'],
      128: ['#ca8a04', '#fff'],
      256: ['#eab308', '#111'],
      512: ['#10b981', '#05110c'],
      1024: ['#06b6d4', '#05110c'],
      2048: ['#8b5cf6', '#fff']
    };

    let board = Array(16).fill(0);
    let prevBoard = null;
    let prevScore = 0;
    let score = 0;
    let best = 0;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovMsg = document.getElementById('ov-msg');

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ board, score, best })); } catch {}
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (s && Array.isArray(s.board) && s.board.length === 16) {
          board = s.board;
          score = s.score || 0;
          best = s.best || 0;
          return true;
        }
      } catch {}
      return false;
    }

    function addTile() {
      const empty = [];
      board.forEach((v, i) => { if (v === 0) empty.push(i); });
      if (!empty.length) return;
      const idx = empty[Math.floor(Math.random() * empty.length)];
      board[idx] = Math.random() < 0.9 ? 2 : 4;
    }

    function newGame() {
      board = Array(16).fill(0);
      prevBoard = null;
      score = 0;
      addTile();
      addTile();
      overlay.classList.add('hidden');
      saveState();
      render();
    }

    function slideLine(line) {
      const nonZero = line.filter((v) => v !== 0);
      let gained = 0;
      for (let i = 0; i < nonZero.length - 1; i++) {
        if (nonZero[i] === nonZero[i + 1]) {
          nonZero[i] *= 2;
          gained += nonZero[i];
          nonZero.splice(i + 1, 1);
        }
      }
      while (nonZero.length < 4) nonZero.push(0);
      return { line: nonZero, gained };
    }

    function move(dir) {
      const snapshot = [...board];
      const scoreSnap = score;
      let changed = false;

      for (let r = 0; r < 4; r++) {
        let idxs = [];
        for (let c = 0; c < 4; c++) {
          if (dir === 'left') idxs.push(r * 4 + c);
          if (dir === 'right') idxs.push(r * 4 + (3 - c));
          if (dir === 'up') idxs.push(c * 4 + r);
          if (dir === 'down') idxs.push((3 - c) * 4 + r);
        }
        const vals = idxs.map((i) => board[i]);
        const { line, gained } = slideLine(vals);
        score += gained;
        idxs.forEach((boardIdx, k) => {
          if (board[boardIdx] !== line[k]) changed = true;
          board[boardIdx] = line[k];
        });
      }

      if (changed) {
        prevBoard = snapshot;
        prevScore = scoreSnap;
        if (score > best) best = score;
        addTile();
        saveState();
        render();
        checkEnd();
      }
    }

    function canMove() {
      if (board.includes(0)) return true;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const v = board[r * 4 + c];
          if (c < 3 && v === board[r * 4 + c + 1]) return true;
          if (r < 3 && v === board[(r + 1) * 4 + c]) return true;
        }
      }
      return false;
    }

    function checkEnd() {
      if (!canMove()) {
        ovMsg.textContent = board.includes(2048) ? 'You Reached 2048!' : 'No Moves Left';
        overlay.classList.remove('hidden');
      }
    }

    function render() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      // Preserve overlay node
      const cells = gridEl.querySelectorAll('.cell');
      if (cells.length !== 16) {
        for (let i = 0; i < 16; i++) {
          const d = document.createElement('div');
          d.className = 'cell';
          gridEl.insertBefore(d, overlay);
        }
      }
      const all = gridEl.querySelectorAll('.cell');
      board.forEach((v, i) => {
        const [bg, fg] = COLORS[v] || ['#ec4899', '#fff'];
        all[i].style.background = bg;
        all[i].style.color = fg;
        all[i].style.fontSize = v >= 1024 ? '20px' : '26px';
        all[i].textContent = v || '';
      });
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
      if (k === 'arrowleft' || k === 'a') move('left');
      else if (k === 'arrowright' || k === 'd') move('right');
      else if (k === 'arrowup' || k === 'w') move('up');
      else if (k === 'arrowdown' || k === 's') move('down');
      else if (k === 'z' && prevBoard) {
        board = [...prevBoard]; score = prevScore; prevBoard = null;
        overlay.classList.add('hidden'); saveState(); render();
      }
    });

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (!prevBoard) return;
      board = [...prevBoard]; score = prevScore; prevBoard = null;
      overlay.classList.add('hidden'); saveState(); render();
    });
    document.getElementById('new-btn').addEventListener('click', newGame);
    document.getElementById('retry-btn').addEventListener('click', newGame);

    if (!loadState() || board.every((v) => v === 0)) {
      newGame();
    } else {
      render();
      checkEnd();
    }
  </script>
</body>
</html>
